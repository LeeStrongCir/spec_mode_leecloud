services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spec_mode_leecloud-app
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///app/data/dev.db
    volumes:
      - lecs-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  lecs-data:
    driver: local
